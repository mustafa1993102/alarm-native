cat > /mnt/user-data/outputs/build.yml << 'EOF'
name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o project.zip -d proj
          mkdir -p proj/app/src/main/assets/quran_pages
          for z in part*.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z" -d proj/app/src/main/assets/quran_pages
            fi
          done
          true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
        working-directory: proj
      - uses: actions/upload-artifact@v4
        with:
          name: alarm-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
EOF
echo ok
